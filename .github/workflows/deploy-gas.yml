# gas/ 폴더(Code.gs)가 바뀌어 GitHub에 올라오면 Apps Script에 자동으로 올리고,
# 같은 웹 앱 주소로 새 버전을 배포해요.
# 필요한 저장소 Secrets: CLASPRC_JSON, GAS_SCRIPT_ID, GAS_DEPLOYMENT_ID
name: Apps Script 자동 배포

on:
  push:
    branches: [main]
    paths: ["gas/**"]
  workflow_dispatch: {}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 설정(Secrets) 확인
        id: check
        env:
          CLASPRC_JSON: ${{ secrets.CLASPRC_JSON }}
          GAS_SCRIPT_ID: ${{ secrets.GAS_SCRIPT_ID }}
          GAS_DEPLOYMENT_ID: ${{ secrets.GAS_DEPLOYMENT_ID }}
        run: |
          if [ -z "$CLASPRC_JSON" ] || [ -z "$GAS_SCRIPT_ID" ] || [ -z "$GAS_DEPLOYMENT_ID" ]; then
            echo "::warning::Secrets가 아직 없어서 Apps Script 배포를 건너뛰어요."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-node@v4
        if: steps.check.outputs.ready == 'true'
        with:
          node-version: "20"

      - name: Apps Script에 코드 올리고 배포
        if: steps.check.outputs.ready == 'true'
        env:
          CLASPRC_JSON: ${{ secrets.CLASPRC_JSON }}
          GAS_SCRIPT_ID: ${{ secrets.GAS_SCRIPT_ID }}
          GAS_DEPLOYMENT_ID: ${{ secrets.GAS_DEPLOYMENT_ID }}
        run: |
          npm install -g @google/clasp@2.4.2
          printf '%s' "$CLASPRC_JSON" > ~/.clasprc.json
          printf '{"scriptId":"%s","rootDir":"gas"}' "$GAS_SCRIPT_ID" > .clasp.json
          clasp push --force
          clasp deploy --deploymentId "$GAS_DEPLOYMENT_ID" --description "GitHub ${GITHUB_SHA::7}"
          clasp deployments
