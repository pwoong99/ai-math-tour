# gas/ 폴더(Code.gs)가 바뀌어 GitHub에 올라오면 Apps Script에 자동으로 올리고,
# 같은 웹 앱 주소로 새 버전을 배포해요.
# 필요한 저장소 Secret: CLASPRC_JSON (스크립트 ID는 .clasp.json, 배포 ID는 아래 env에 있어요)
name: Apps Script 자동 배포

on:
  push:
    branches: [main]
    paths: ["gas/**"]
  workflow_dispatch: {}

env:
  # 지금 쓰는 웹 앱 배포 ID — 이 배포에 새 버전을 올려서 주소가 바뀌지 않아요
  DEPLOYMENT_ID: AKfycbyt01DVZvpM_9gmX4aNmFDlQXtAExeKE7Pt01fOgaXbbSf03cRKBt0fzrQB_6F9u58

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 설정(Secrets) 확인
        id: check
        env:
          CLASPRC_JSON: ${{ secrets.CLASPRC_JSON }}
        run: |
          if [ -z "$CLASPRC_JSON" ]; then
            echo "::warning::CLASPRC_JSON Secret이 아직 없어서 Apps Script 배포를 건너뛰어요."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-node@v4
        if: steps.check.outputs.ready == 'true'
        with:
          node-version: "20"

      - name: Apps Script에 코드 올리고 배포
        if: steps.check.outputs.ready == 'true'
        env:
          CLASPRC_JSON: ${{ secrets.CLASPRC_JSON }}
        run: |
          npm install -g @google/clasp@2.4.2
          printf '%s' "$CLASPRC_JSON" > ~/.clasprc.json
          clasp push --force
          clasp deploy --deploymentId "$DEPLOYMENT_ID" --description "GitHub ${GITHUB_SHA::7}"
          clasp deployments
